<div class="table-header-grid">
  <span>{{ t.date }}</span>
  <span>{{ t.amount }}</span>
  <span>{{ t.currency }}</span>
  <span>{{ t.category }}</span>
  <span>{{ t.description }}</span>
  <span></span>
</div>
<table>
  <tbody>
    {% for expense in expenses %}
    <tr>
      <td colspan="6">
        <form class="row-form" hx-post="/expenses/{{ expense.id }}" hx-target="#expenses-table">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <input
            type="datetime-local"
            name="spent_at"
            value="{{ (expense.spent_at|datetime_local(user.timezone)).strftime('%Y-%m-%dT%H:%M') }}"
            aria-label="{{ t.date }}"
          >
          <input
            type="number"
            step="0.01"
            min="0.01"
            name="amount"
            value="{{ expense.amount }}"
            aria-label="{{ t.amount }}"
            class="{% if expense.kind == 'income' %}income-field{% else %}expense-field{% endif %}"
          >
          <span>{{ expense.currency }}</span>
          <select name="category_id" aria-label="{{ t.category }}">
            {% for category in categories %}
            <option value="{{ category.id }}" {% if category.id == expense.category_id %}selected{% endif %}>
              {{ category.name|category_label(user.locale) }}
            </option>
            {% endfor %}
          </select>
          <input type="text" name="description" value="{{ expense.description }}" aria-label="{{ t.description }}">
          <div class="actions">
            <button
              type="submit"
              class="action-button"
              title="{{ t.save }}"
              aria-label="{{ t.save }}"
            >
              {{ t.save }}
            </button>
            <button
              type="button"
              class="danger action-button"
              hx-delete="/expenses/{{ expense.id }}"
              hx-target="#expenses-table"
              hx-confirm="{{ t.delete }}?"
              title="{{ t.delete }}"
              aria-label="{{ t.delete }}"
            >
              {{ t.delete }}
            </button>
          </div>
        </form>
      </td>
    </tr>
    {% else %}
    <tr>
      <td colspan="6" class="empty">{{ t.no_expenses }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
