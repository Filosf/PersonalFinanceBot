[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-finance-bot-dashboard"
version = "0.1.0"
description = "Telegram bot and FastAPI dashboard for personal expense tracking"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.6,<4",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "greenlet>=3.0,<4",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "Pillow>=10,<12",
    "pydantic-settings>=2.4,<3",
    "pytesseract>=0.3.10,<1",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy>=2.0,<3",
    "structlog>=24.1,<25",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["app*"]
